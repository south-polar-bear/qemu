name: Build QEMU

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发
    inputs:
      qemu_version:
        description: 'QEMU version to build (e.g., 8.2.0)'
        required: true
        default: '8.2.0'
      targets:
        description: 'Targets to build (e.g., x86_64-softmmu,aarch64-softmmu)'
        required: true
        default: 'x86_64-softmmu,aarch64-softmmu,riscv64-softmmu'

jobs:
  build:
    name: Build QEMU ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        target: [x86_64-softmmu]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          python3-venv \
          python3-dev \
          python3-pip \
          ninja-build \
          pkg-config \
          libglib2.0-dev \
          libpixman-1-dev \
          libfdt-dev \
          libsdl2-dev \
          libsdl2-image-dev \
          libgtk-3-dev \
          libspice-server-dev \
          libusb-1.0-0-dev \
          libusbredirparser-dev \
          libssh-dev \
          libcurl4-openssl-dev \
          libcapstone-dev \
          libslirp-dev \
          liblzo2-dev \
          libsnappy-dev \
          libbz2-dev \
          libzstd-dev \
          libseccomp-dev \
          libgnutls28-dev \
          libnfs-dev \
          libiscsi-dev \
          libcacard-dev \
          libbrlapi-dev \
          libaio-dev \
          libvdeplug-dev \
          libspice-protocol-dev \
          libxen-dev \
          libu2f-server-dev \
          libu2f-host-dev \
          liburing-dev \
          libattr1-dev \
          libcap-ng-dev \
          libjpeg-dev \
          libpng-dev \
          libsasl2-dev \
          libvte-2.91-dev \
          libxkbcommon-dev \
          libepoxy-dev \
          libgbm-dev \
          libdrm-dev \
          libvirglrenderer-dev \
          libbluetooth-dev \
          libcap-dev \
          libnuma-dev \
          libpmem-dev \
          libdaxctl-dev \
          librados-dev \
          liblttng-ust-dev \
          libsystemd-dev \
          libpam0g-dev \
          libselinux1-dev \
          libkeyutils-dev \
          libglusterfs-dev \
          valgrind \
          ccache \
          meson

    - name: Setup Python virtual environment
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme

    - name: Cache QEMU source
      id: cache-qemu
      uses: actions/cache@v3
      with:
        path: qemu-source
        key: ${{ runner.os }}-qemu-source-${{ github.event.inputs.qemu_version || '8.2.0' }}

    - name: Download QEMU source
      if: steps.cache-qemu.outputs.cache-hit != 'true'
      run: |
        QEMU_VERSION=${{ github.event.inputs.qemu_version || '8.2.0' }}
        wget https://download.qemu.org/qemu-$QEMU_VERSION.tar.xz
        tar xf qemu-$QEMU_VERSION.tar.xz
        mv qemu-$QEMU_VERSION qemu-source

    - name: Create build directory
      run: mkdir -p build

    - name: Configure QEMU
      working-directory: build
      run: |
        source ../venv/bin/activate
        ../qemu-source/configure \
          --target-list=${{ matrix.target }} \
          --enable-debug \
          --enable-kvm \
          --enable-virtfs \
          --enable-linux-aio \
          --enable-cap-ng \
          --enable-vhost-net \
          --enable-vhost-crypto \
          --enable-vhost-scsi \
          --enable-vhost-vsock \
          --enable-vhost-user \
          --enable-spice \
          --enable-gtk \
          --enable-sdl \
          --enable-curses \
          --enable-vnc \
          --enable-vnc-jpeg \
          --enable-vnc-png \
          --enable-vnc-sasl \
          --enable-slirp \
          --enable-tools \
          --enable-bochs \
          --enable-cloop \
          --enable-dmg \
          --enable-parallels \
          --enable-qed \
          --enable-vhdx \
          --enable-vvfat \
          --enable-qcow1 \
          --enable-plugins \
          --enable-libiscsi \
          --enable-libnfs \
          --enable-rbd \
          --enable-curl \
          --enable-fdt=system \
          --enable-capstone=system \
          --enable-attr \
          --enable-libxml2 \
          --enable-bzip2 \
          --enable-lzo \
          --enable-snappy \
          --enable-zstd \
          --enable-seccomp \
          --enable-pie \
          --prefix=${{ github.workspace }}/qemu-install

    - name: Build QEMU
      working-directory: build
      run: |
        make -j$(nproc)
        make install

    - name: Run basic tests
      working-directory: build
      run: |
        make check -j$(nproc) || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qemu-${{ matrix.os }}-${{ matrix.target }}
        path: |
          qemu-install/**
          !qemu-install/**/*.o
          !qemu-install/**/*.a
        retention-days: 30

    - name: Create compressed archive
      run: |
        cd qemu-install
        tar -czf ../qemu-${{ matrix.os }}-${{ matrix.target }}.tar.gz *
        cd ..

    - name: Upload compressed artifact
      uses: actions/upload-artifact@v4
      with:
        name: qemu-${{ matrix.os }}-${{ matrix.target }}-archive
        path: qemu-*.tar.gz
        retention-days: 30
